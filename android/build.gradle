// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.3.1'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

// Use the installed SDK 37 tools for the app and all Capacitor Android modules.
subprojects {
    ['com.android.application', 'com.android.library'].each { pluginId ->
        plugins.withId(pluginId) {
            androidComponents.finalizeDsl { androidDsl ->
                androidDsl.buildToolsVersion = '37.0.0'
            }
        }
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // Capacitor 9.0.0-rc.0 的 capacitor-cordova-android-plugins 模板末尾有
    // `for (def func : cdvPluginPostBuildExtras)`，但模板未随附 cordova.variables.gradle
    // （sync 每次重建该目录，仅在有 Cordova 插件时才写入），无 Cordova 插件的工程会报
    // unknown property。在此注入空数组兜底；若后续版本补齐则本地生成文件会自然覆盖。
    ext.cdvPluginPostBuildExtras = []
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
